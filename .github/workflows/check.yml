name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    # Playwright 1.58.2 supports Ubuntu 24.04, not the 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dom
      - uses: actions/cache@v4
        with:
          path: models/*.gguf
          key: plamo-${{ hashFiles('models/model.json') }}
      - run: npm run model:download
      - run: npm run build
